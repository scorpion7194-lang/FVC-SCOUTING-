<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fairview Scouting</title>
<link rel="manifest" href="manifest.json">

<style>
:root{--ink:#1c2b1f;--paper:#f6f4ec;--acc:#2d6a3e;--line:#cfcab8;--warn:#b3402a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:16px/1.4 system-ui,sans-serif;color:var(--ink);background:var(--paper)}
#map{position:absolute;inset:0}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:1000;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:2px solid var(--ink)}
.bar button,.sheet button{flex:1;min-height:48px;font:600 15px system-ui;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:8px;padding:0 8px}
button.go{background:var(--acc);color:#fff;border-color:var(--acc)}
button.no{color:var(--warn);border-color:var(--warn)}
#dinfo,#einfo{flex:2;align-self:center;font-weight:700;text-align:center}
.hide{display:none!important}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1100;max-height:85%;overflow:auto;background:var(--paper);border-top:3px solid var(--ink);padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font-size:20px}
.sheet label{display:block;font-weight:600;margin:10px 0 3px}
.sheet input[type=text],.sheet input[type=date],.sheet input[type=number],.sheet select,.sheet textarea{width:100%;font:16px system-ui;padding:10px;border:2px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row input[type=text]{flex:1}
.row input[type=color]{width:44px;height:44px;border:2px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.row input[type=checkbox],.row input[type=radio]{width:24px;height:24px}
.row button{flex:none;min-height:44px}
.btns{display:flex;gap:8px;margin-top:14px}
.pin{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #000;font-size:13px;line-height:20px;text-align:center}
.lbl{background:rgba(0,0,0,.65);border:0;color:#fff;font-weight:700;box-shadow:none}
.lbl:before{display:none}
.me{background:#1a73e8;border:3px solid #fff;border-radius:50%}
.pop img{max-width:200px;display:block;margin:6px 0;border-radius:6px}
.small{font-size:13px;color:#555}
#fab{position:absolute;right:12px;top:calc(80px + env(safe-area-inset-top,0px));z-index:1000;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
#yr{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:1000;font:700 16px system-ui;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
#legend{position:absolute;left:12px;top:calc(68px + env(safe-area-inset-top,0px));z-index:900;background:rgba(255,255,255,.9);border-radius:8px;font:600 13px system-ui}
#legend:empty{display:none}
#legend div{padding:4px 10px;display:flex;align-items:center;gap:6px}
#legend i{width:14px;height:14px;border-radius:3px;display:inline-block;flex:none}
#legend span{flex:1}
#legend b{margin-left:10px;font-weight:700}
.lbl{text-align:center}
#fab2{position:absolute;right:12px;top:calc(144px + env(safe-area-inset-top,0px));z-index:1000;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.bub{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);color:#fff;font:700 15px/32px system-ui;text-align:center;text-shadow:0 0 3px #000}
.lbl2{font-size:12px;background:rgba(150,30,30,.8)}
.orow{border-top:1px solid var(--line);padding:10px 0}
.orow img{width:72px;height:72px;object-fit:cover;border-radius:6px;margin:6px 6px 0 0}
#lb{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:14px system-ui}
#lb img{max-width:100%;max-height:90%;object-fit:contain}
.ph{display:inline-block;margin:8px 8px 0 0;vertical-align:top;width:140px}
.ph img{width:140px;height:140px;object-fit:cover;border-radius:8px;display:block}
.ph button{width:100%;min-height:36px;margin-top:4px;font-size:14px}
.pop img[data-zoom]{cursor:zoom-in}
#fabH{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:1000;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
#home{position:fixed;inset:0;z-index:2000;background:var(--paper);overflow:auto;display:flex;flex-direction:column}
.hhead{background:var(--ink);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 0}
.hname{font:700 26px/1.15 system-ui}
.hsub{opacity:.8;margin:2px 0 12px}
.hhead svg{display:block;margin:0 -18px;width:calc(100% + 36px)}
.hstats{display:flex;gap:8px;padding:14px 14px 4px}
.stat{flex:1;display:flex;flex-direction:column}
.stat b{font:700 28px/1 system-ui}
.stat span{font-size:13px;color:#555;margin-top:2px}
.htiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px}
.htiles button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:14px 12px;min-height:112px;font:inherit}
.htiles svg{width:34px;height:34px;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--acc);margin-bottom:6px}
.htiles b{font-size:18px}
.htiles span{font-size:13px;color:#555;line-height:1.25}
.hlink{margin:2px 14px 0;min-height:48px;border:2px solid var(--ink);background:transparent;border-radius:10px;font:600 15px system-ui;color:var(--ink)}
.hnote{padding:10px 14px calc(18px + env(safe-area-inset-bottom,0px));font-size:13px;color:#555}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.sheet .tiles button{flex:none;min-height:84px;color:#fff;border:0;border-radius:12px;font:700 15px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.tiles .e{font-size:28px;line-height:1.1}
.tiles.has button:not(.on){opacity:.4}
.tiles button.on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
.seg,.two{display:flex;gap:8px}
.sheet .seg button.on{background:var(--ink);color:#fff}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.sheet .fgrid button{min-height:52px}
.sheet button.blue{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
.notebox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0}
.sheet h3{margin:14px 0 2px;font-size:16px}
#drawbar{flex-direction:column}
#drawbar .r{display:flex;gap:6px}
#drawbar button{font-size:14px;padding:0 4px}
#dinfo,#einfo{position:fixed;top:0;left:0;right:0;z-index:1000;flex:none;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:rgba(28,43,31,.92);color:#fff;font-size:18px;font-weight:400;text-align:center}
#dinfo span,#einfo span{margin:0 10px}
.sl{position:absolute;transform:translate(-50%,-26px);background:rgba(0,0,0,.7);color:#fff;font:600 13px system-ui;padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none}
button.on{background:var(--ink)!important;color:#fff!important}
#xh{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:900;pointer-events:none;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000}
#xh:before,#xh:after{content:'';position:absolute;background:#fff;box-shadow:0 0 0 1px #000}
#xh:before{left:50%;top:-14px;bottom:-14px;width:2px;margin-left:-1px}
#xh:after{top:50%;left:-14px;right:-14px;height:2px;margin-top:-1px}
.vh{width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid #000;box-sizing:border-box}
.mh{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #000;box-sizing:border-box;opacity:.85}
.pop button.hit{display:block;width:100%;text-align:left;margin:6px 0 0;padding:6px 10px}
.pop button{min-height:40px;border:2px solid var(--ink);background:#fff;border-radius:8px;padding:0 10px;margin:6px 4px 0 0;font-weight:600}

#home{background:#07141d url(background.jpg) center/cover no-repeat}
#home:before{content:'';position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(7,20,29,.84) 0%,rgba(10,30,44,.62) 40%,rgba(10,30,44,.74) 100%)}
#home>*{position:relative;z-index:1}
.hhead{background:transparent;padding-bottom:6px}
.hname{text-shadow:0 2px 8px rgba(0,0,0,.55)}
.hsub{opacity:.95}
.stat b{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.stat span{color:rgba(255,255,255,.92)}
.htiles button{background:rgba(255,255,255,.95)}
.hlink{background:rgba(255,255,255,.95)}
.hnote{color:rgba(255,255,255,.9)}

.hname{color:#4fd1ff;text-shadow:0 2px 10px rgba(0,0,0,.65)}
.hsub{color:#9fdcf5;opacity:1;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.stat b{color:#4fd1ff;text-shadow:0 1px 8px rgba(0,0,0,.75)}
.stat span{color:#9fdcf5;text-shadow:0 1px 6px rgba(0,0,0,.65)}
.hnote{color:#9fdcf5;text-shadow:0 1px 6px rgba(0,0,0,.65)}

.htiles button{background:rgba(8,24,36,.78);border:2px solid rgba(79,209,255,.85);color:#4fd1ff;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.htiles b{color:#4fd1ff}
.htiles span{color:#9fdcf5}
.htiles svg{stroke:#4fd1ff;color:#4fd1ff}
.hlink{background:rgba(8,24,36,.78);border:2px solid rgba(79,209,255,.85);color:#4fd1ff}

:root{--paper:#0c1c27;--ink:#4fd1ff;--line:rgba(79,209,255,.35);--acc:#4fd1ff;--warn:#ff9a7a}

.bar button,.sheet button{background:rgba(255,255,255,.05);color:#4fd1ff;border-color:rgba(79,209,255,.85)}
button.go,.sheet button.go{background:#4fd1ff;color:#06222e;border-color:#4fd1ff}
.sheet button.blue{background:rgba(255,255,255,.05);color:#4fd1ff;border-color:rgba(79,209,255,.85)}
button.no,.sheet button.no{color:#ff9a7a;border-color:#ff9a7a;background:transparent}
.sheet{background:rgba(10,26,38,.97);border-top:3px solid #4fd1ff;color:#d6f2ff}
.sheet .small,.small{color:#9fdcf5}
.sheet h2,.sheet h3{color:#4fd1ff}
.sheet input[type=text],.sheet input[type=date],.sheet input[type=number],.sheet select,.sheet textarea{background:#12303f;color:#d6f2ff;border-color:rgba(79,209,255,.4)}

#fab,#fab2,#fabH{background:#0c1c27;border-color:#4fd1ff}
#fab svg,#fab2 svg,#fabH svg{stroke:#4fd1ff}
#fab svg circle[fill],#fab2 svg circle[fill]{fill:#4fd1ff}
.htiles .wide{grid-column:1/-1}
.htiles button.due{border-color:#ff9a7a}.htiles button.due span{color:#ff9a7a;font-weight:700}
.trow{display:flex;gap:10px;align-items:flex-start}
.sheet .tk{width:38px;height:38px;min-height:38px;flex:0 0 38px;border-radius:50%;padding:0;font:700 20px/1 system-ui;margin:0}
.sheet .tk.on{background:#4fd1ff;color:#06222e}
.late{color:#ff9a7a!important;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sheet .chips button{flex:1 0 28%;min-height:40px;padding:0 8px;font-size:14px}
#pinInfo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:1100;background:rgba(8,22,32,.95);color:#4fd1ff;border:2px solid #4fd1ff;border-radius:12px;padding:8px 14px;font:600 15px system-ui;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}#pinInfo.hide{display:none}
body.rnd .lbl{display:none}
#pinbar:not(.round) #rMark{display:none}#pinbar.round #pGps,#pinbar.round #pDrop{display:none}
.pin.todo{background:#ff7a00!important;border-color:#fff;box-shadow:0 0 0 2px #000,0 0 0 6px rgba(255,122,0,.55);animation:tdp 1.3s infinite}
@keyframes tdp{50%{box-shadow:0 0 0 2px #000,0 0 0 12px rgba(255,122,0,0)}}
.npin{width:26px;height:26px;border-radius:50%;background:#0c1c27;border:2px solid #4fd1ff;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 0 2px #000}
.nrow{border-top:1px solid rgba(79,209,255,.3);padding:10px 0}.nrow .nd{font-weight:700;color:#4fd1ff}.nrow .nt{white-space:pre-wrap;margin-top:2px}.nrow img{width:64px;height:64px;object-fit:cover;border-radius:6px;margin:6px 6px 0 0}
.nph{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}.nph div{width:92px}.nph img{width:92px;height:92px;object-fit:cover;border-radius:8px;display:block}.nph button{width:100%;min-height:34px!important;margin-top:4px;font-size:13px}
.catgrid{display:grid!important;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.sheet .catgrid button{min-height:52px;padding:0 4px}
.sheet .seg button.on{background:#4fd1ff;color:#06222e;border-color:#4fd1ff}
.pit{display:flex;gap:8px;align-items:flex-start;border-top:1px solid rgba(79,209,255,.3);padding:10px 0}
.pit .pb{flex:1;min-width:0}.pit .pt{font-weight:700;color:#4fd1ff}.pit .pn{white-space:pre-wrap;margin-top:2px;font-size:14px}
.pit.done .pt,.pit.done .pn{opacity:.55;text-decoration:line-through}
.sheet .pit button{flex:none;min-height:36px;width:36px;padding:0;font-size:16px}
.sheet .pit .mvs{display:flex;flex-direction:column;gap:4px}
.sheet .pit button.ck.on{background:#4fd1ff;color:#06222e;border-color:#4fd1ff}
.pg{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9fdcf5;margin:14px 0 0}

<body>
<div id="map"></div>

<div id="home">
  <div class="hhead">
    <div class="hname">Fairview Colony Farms</div>
    <div class="hsub">Crop scouting and field records</div>
  </div>
  <div class="hstats" id="hstats"></div>
  <div class="htiles">
    <button data-go="tasks" id="tTasks" class="wide"><svg viewBox="0 0 24 24"><path d="M9 3h6v3H9z"/><path d="M7 5H5v16h14V5h-2"/><path d="M9 14l2 2 4-4"/></svg><b>Tasks &amp; Reminders</b><span id="tTaskSub"></span></button>
    <button data-go="map"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><b>Field Map</b><span>Your fields and pins</span></button>
    <button data-go="draw"><svg viewBox="0 0 24 24"><path d="M5 8l6-4 8 4 1 8-8 4-7-5z"/></svg><b>Draw / Measure</b><span>Fields, patches, manure</span></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let locMode=false,sc=null,fcard='';
let S={layers:[{id:'L1',name:'Fields',color:'#f2c94c',visible:true},{id:'L2',name:'Scouting notes',color:'#35a7ff',visible:true}],items:[],active:'L1',obsLayer:'L2'};

/* storage: IndexedDB so photos don't hit the small localStorage limit */
const DB=new Promise(r=>{try{const q=indexedDB.open('scout',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function load(){try{const d=await DB;return await new Promise(r=>{const q=d.transaction('s').objectStore('s').get('state');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}}
async function save(){try{const d=await DB;d.transaction('s','readwrite').objectStore('s').put(S,'state')}catch(e){}}

/* map */
const map=L.map('map',{zoomControl:false}).setView([51.40,-113.80],11);
const WB='https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/';
const BASES=[
 {k:'esri',n:'Esri satellite (current)',d:'The map you have been using',u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',nz:19,at:'Esri World Imagery'},
 {k:'w2609',n:'Esri · Sep 24, 2026',d:'Newest saved version',u:WB+'63116/{z}/{y}/{x}',nz:18,at:'Esri World Imagery (Wayback 2026-09-24)'},
 {k:'w2608',n:'Esri · Aug 5, 2026',d:'Summer 2026',u:WB+'26334/{z}/{y}/{x}',nz:18,at:'Esri World Imagery (Wayback 2026-08-05)'},
 {k:'w2606',n:'Esri · Jun 30, 2026',d:'Early summer 2026',u:WB+'32246/{z}/{y}/{x}',nz:18,at:'Esri World Imagery (Wayback 2026-06-30)'},
 {k:'w2605',n:'Esri · May 28, 2026',d:'Spring 2026',u:WB+'10842/{z}/{y}/{x}',nz:18,at:'Esri World Imagery (Wayback 2026-05-28)'},
 {k:'w2510',n:'Esri · Oct 23, 2025',d:'Fall 2025',u:WB+'20512/{z}/{y}/{x}',nz:18,at:'Esri World Imagery (Wayback 2025-10-23)'},
 {k:'w2509',n:'Esri · Sep 25, 2025',d:'Late summer 2025',u:WB+'58924/{z}/{y}/{x}',nz:18,at:'Esri World Imagery (Wayback 2025-09-25)'},
 {k:'mb1',n:'Mapbox satellite',d:'Satellite pictures only',mb:'satellite-v9',at:'© Mapbox © OpenStreetMap © Maxar'},
 {k:'mb2',n:'Mapbox satellite with roads and names',d:'Satellite with road names and labels',mb:'satellite-streets-v12',at:'© Mapbox © OpenStreetMap © Maxar'}];
let BASE=null;
function applyBase(){
  let b=BASES.find(x=>x.k===S.basemap)||BASES[0];
  if(b.mb&&!S.mapboxToken)b=BASES[0];
  if(BASE)map.removeLayer(BASE);
  if(b.mb){
    BASE=L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/'+b.mb+'/tiles/{z}/{x}/{y}?access_token='+encodeURIComponent(S.mapboxToken),{tileSize:512,zoomOffset:-1,maxZoom:19,attribution:b.at});
    let bad=0,good=0;BASE.on('tileload',()=>{good++});
    BASE.on('tileerror',()=>{bad++;if(bad===6&&!good&&!window.mbWarned){window.mbWarned=1;alert('The Mapbox map is not loading. That is either weak signal or a wrong token. Check it under the map picture button.')}});
  }else BASE=L.tileLayer(b.u,{maxZoom:19,maxNativeZoom:b.nz,attribution:b.at});
  BASE.addTo(map);BASE.bringToBack();
}
function setBase(k){const b=BASES.find(x=>x.k===k);if(b&&b.mb&&!S.mapboxToken){alert('Paste your Mapbox token first (the box under the list), then pick this map.');return}S.basemap=k;save();applyBase();baseSheet()}
function saveToken(){
  let t=($('#mbt').value||'').trim();
  if(t&&!/^pk\.[A-Za-z0-9._-]{20,}$/.test(t)){alert('That does not look like a Mapbox public token. It starts with pk. and is a long line of letters and numbers.');return}
  if(t)S.mapboxToken=t;else{delete S.mapboxToken;if((BASES.find(x=>x.k===S.basemap)||{}).mb)S.basemap='esri'}
  save();applyBase();baseSheet();
}
function baseSheet(){
  const cur=(BASES.find(x=>x.k===S.basemap)||BASES[0]).k;
  open('<h2 style="margin:0">Map picture</h2><div class="small">Pick the satellite picture that looks best over your fields. Your fields, notes and plans do not change.</div>'+
    BASES.map(b=>'<div class="orow" onclick="setBase(\''+b.k+'\')"><b>'+(b.k===cur?'✓ ':'')+esc(b.n)+'</b><div class="small">'+esc(b.d)+(b.mb&&!S.mapboxToken?' · needs your Mapbox token':'')+'</div></div>').join('')+
    '<h3>Mapbox token</h3><div class="small">Get a free token at mapbox.com. It is the long code that starts with pk. Paste it here once, tap Save, then pick a Mapbox map above.</div>'+
    '<input type="text" id="mbt" placeholder="pk.…" value="'+esc(S.mapboxToken||'')+'" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="btns"><button onclick="saveToken()">'+(S.mapboxToken?'Update / remove token':'Save token')+'</button></div>'+
    '<div class="small" style="margin-top:8px">If part of the map shows blank squares when zoomed in close, pick another date or go back to the current map.</div>'+
    '<div class="btns"><button class="go" onclick="closeSheet()">Done</button></div>');
}
applyBase();
const G=L.layerGroup().addTo(map);

/* area on a sphere, square metres */
function area(p){if(p.length<3)return 0;const R=6378137,r=Math.PI/180;let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=(b[1]-a[1])*r*(2+Math.sin(a[0]*r)+Math.sin(b[0]*r))}return Math.abs(s*R*R/2)}
function dist(a,b){const r=Math.PI/180,R=6371008,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r,x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const per=p=>{let t=0;for(let i=0;i<p.length;i++)t+=dist(p[i],p[(i+1)%p.length]);return t};
const fmtLen=m=>{const f=m*3.28084;return f>=1320?(f/5280).toFixed(2)+' mi':Math.round(f)+' ft'};
const holesOf=i=>i.holes||[];
const netArea=i=>area(i.pts)-holesOf(i).reduce((a,h)=>a+area(h.pts),0);
const members=i=>i.group?S.items.filter(x=>x.type==='poly'&&x.group===i.group):[i];
const acOf=a=>(a/4046.856).toFixed(1);
function polyInfo(i,noCuts){
  let h='<div>'+fmt(netArea(i))+', perimeter '+fmtLen(per(i.pts))+(holesOf(i).length?' (after cutouts)':'')+'</div>';
  if(i.group){const mm=members(i);h+='<div>Farmed as <b>'+esc(i.group)+'</b>: '+mm.length+' part'+(mm.length>1?'s':'')+', '+acOf(mm.reduce((a,x)=>a+netArea(x),0))+' ac total</div>'}
  if(!noCuts)holesOf(i).forEach((hh,k)=>{h+='<div class="orow" onclick="cutSheet(\''+i.id+'\','+k+')"><b>Cutout'+(holesOf(i).length>1?' '+(k+1):'')+(hh.name?': '+esc(hh.name):'')+'</b><div class="small">'+(area(hh.pts)/4046.856).toFixed(2)+' ac · tap to rename or remove</div></div>'});
  return h;
}
const fm=p=>fmt(area(p))+', perimeter '+fmtLen(per(p));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const fmt=m=>(m/4046.856).toFixed(2)+' ac ('+(m/10000).toFixed(2)+' ha)';

/* GPS */
let gps=null,meMk=null,watching=false,walk=false,xhOn=false;
function startGps(cb){
  if(!navigator.geolocation){alert('This browser has no GPS access.');return}
  if(watching){if(gps&&cb)cb();return}
  watching=true;
  navigator.geolocation.watchPosition(p=>{
    const first=!gps;gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
    if(!meMk)meMk=L.marker([gps.lat,gps.lng],{icon:L.divIcon({className:'',html:'<div class="me" style="width:18px;height:18px"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false}).addTo(map);
    else meMk.setLatLng([gps.lat,gps.lng]);
    if(walk&&draw)walkPt();
    scGpsUpdate();
    if(first){map.setView([gps.lat,gps.lng],17);if(cb)cb()}
  },e=>{watching=false;alert('Could not get location: '+e.message+'\nGPS needs the page to be opened over https and location allowed.')},{enableHighAccuracy:true,maximumAge:2000});
}
const goMe=()=>{if(gps)map.setView([gps.lat,gps.lng],Math.max(map.getZoom(),17));else startGps()};
$('#fab').onclick=goMe;

/* sheets */
const sheet=$('#sheet');
function open(html){sheet.innerHTML=html;sheet.classList.remove('hide');$('#main').classList.add('hide')}
function closeSheet(){if(typeof HLG!=='undefined')HLG.clearLayers();sheet.classList.add('hide');sheet.innerHTML='';if(!draw&&!pin&&!locMode)$('#main').classList.remove('hide');if(pin)$('#pinbar').classList.remove('hide')}
const layerOpts=sel=>S.layers.map(l=>'<option value="'+l.id+'"'+(l.id===sel?' selected':'')+'>'+esc(l.name)+'</option>').join('');

/* layers */
function layersSheet(){
  open('<h2>Layers</h2><div class="small">Tap the circle to choose the layer you are drawing into.</div>'+'<label style="display:flex;gap:8px;align-items:center;font-weight:400;margin:8px 0"><input type="checkbox" style="width:22px;height:22px" '+(S.byCrop!==false?'checked':'')+' onchange="S.byCrop=this.checked;save();redraw()">Colour fields by crop</label>'+cropColorRows()+
  S.layers.map(l=>'<div class="row"><input type="checkbox" '+(l.visible?'checked':'')+' onchange="lyr(\''+l.id+'\',\'visible\',this.checked)">'+
  '<input type="color" value="'+l.color+'" onchange="lyr(\''+l.id+'\',\'color\',this.value)">'+
  '<input type="text" value="'+esc(l.name)+'" onchange="lyr(\''+l.id+'\',\'name\',this.value)">'+
  '<input type="radio" name="act" '+(S.active===l.id?'checked':'')+' onchange="S.active=\''+l.id+'\';save()">'+
  '<button class="no" onclick="delLayer(\''+l.id+'\')">✕</button></div><label style="display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px;margin:0 0 8px 40px"><input type="checkbox" style="width:20px;height:20px" '+(l.always?'checked':'')+' onchange="lyr(\''+l.id+'\',\'always\',this.checked)">Show in every year</label>').join('')+
  '<h2 style="margin-top:18px">Add layer</h2><div class="row"><input type="color" id="nc" value="#e5484d"><input type="text" id="nn" placeholder="e.g. Wild oat patch"><button class="go" onclick="addLayer()">Add</button></div>'+
  '<div class="btns"><button onclick="backupData()">Back up</button><button onclick="restoreData()">Restore</button><button class="go" onclick="closeSheet()">Done</button></div>');
}
function lyr(id,k,v){const l=S.layers.find(x=>x.id===id);l[k]=v;save();redraw()}
function addLayer(){const n=$('#nn').value.trim();if(!n)return;const l={id:uid(),name:n,color:$('#nc').value,visible:true,always:false};S.layers.push(l);S.active=l.id;save();layersSheet();redraw()}
function delLayer(id){const n=S.items.filter(i=>i.layer===id).length;if(!confirm('Delete this layer'+(n?' and its '+n+' items':'')+'?'))return;S.layers=S.layers.filter(l=>l.id!==id);S.items=S.items.filter(i=>i.layer!==id);if(!S.layers.find(l=>l.id===S.active))S.active=(S.layers[0]||{}).id;save();layersSheet();redraw()}
$('#bLayers').onclick=layersSheet;

/* render */
let YR=String(new Date().getFullYear());
const yrOf=i=>i.date?+i.date.slice(0,4):new Date(i.t).getFullYear();
function refreshYears(){
  const cy=new Date().getFullYear(),ys=new Set([cy-2,cy-1,cy,cy+1,cy+2,cy+3,cy+4]);S.items.forEach(i=>{ys.add(yrOf(i));Object.keys(i.crops||{}).forEach(y=>{if(/^\d{4}$/.test(y))ys.add(+y)})});if(YR!=='all')ys.add(+YR);
  $('#yr').innerHTML=[...ys].sort((x,y)=>y-x).map(y=>'<option value="'+y+'">'+y+'</option>').join('')+'<option value="all">All years</option>';
  $('#yr').value=YR;
}
$('#yr').onchange=()=>{YR=$('#yr').value;redraw()};
function migrate(){S.notes=S.notes||[];S.fplan=S.fplan||{};S.fplan.groups=S.fplan.groups&&S.fplan.groups.length?S.fplan.groups:['Canola','Wheat','Barley','Spraying','Other'];S.fplan.items=S.fplan.items||[];S.fplan.years=S.fplan.years||[];S.tasks=S.tasks||[];S.sets=S.sets||[];S.rounds=S.rounds||[];if(S.round===undefined)S.round=null;S.layers.forEach(l=>{if(l.always===undefined)l.always=/^(fields|soil samples)$/i.test((l.name||'').trim())});
  /* old single field note -> first entry in the new notes list */
  S.items.forEach(i=>{if(i.type==='poly'&&!i.noteMig){const l=S.layers.find(x=>x.id===i.layer);if(l&&l.always){if(i.note&&String(i.note).trim())S.notes.push({id:uid(),field:i.id,date:i.date||new Date(i.t||Date.now()).toISOString().slice(0,10),type:'Other',text:String(i.note).trim(),photos:[],pos:null,t:i.t||Date.now()});i.note='';i.noteMig=true}}})}
const CROPC={wheat:'#d64545',barley:'#43a047',canola:'#f2c94c',oats:'#fb8c00',peas:'#26a69a',silage:'#8e24aa',hay:'#1e88e5',alfalfa:'#1e88e5',fallow:'#9e9e9e',flax:'#5c6bc0',corn:'#cddc39',lentil:'#a1887f'};
function cropColor(c){const k=c.toLowerCase().trim();if(S.cropColors&&S.cropColors[k])return S.cropColors[k];for(const n in CROPC)if(k.includes(n))return CROPC[n];let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))%360;return 'hsl('+h+',55%,45%)'}
const DEFCROPS=['Wheat','Barley','Canola','Oats','Peas','Silage','Hay','Fallow','Flax','Lentils'];
function cropNames(){const m={};DEFCROPS.forEach(c=>m[c.toLowerCase()]=c);S.items.forEach(i=>Object.values(i.crops||{}).forEach(c=>{const k=c.toLowerCase().trim();if(k&&!m[k])m[k]=c.trim()}));return Object.values(m)}
function hex(c){const x=document.createElement('canvas').getContext('2d');x.fillStyle=c;return x.fillStyle}
function cropColorRows(){
  return '<h2 style="margin-top:16px;font-size:17px">Crop colours</h2><div class="small">Pick the colour each crop shows on the map.</div>'+
  cropNames().map(c=>'<div class="row"><input type="color" value="'+hex(cropColor(c))+'" onchange="setCropColor(\''+encodeURIComponent(c)+'\',this.value)"><div style="flex:1;font-weight:600">'+esc(c)+'</div></div>').join('');
}
function setCropColor(n,v){S.cropColors=S.cropColors||{};S.cropColors[decodeURIComponent(n).toLowerCase().trim()]=v;save();redraw()}
const cropYear=()=>YR==='all'?String(new Date().getFullYear()):YR;
const cropOf=(i,l)=>S.byCrop!==false&&l.always&&i.crops?i.crops[cropYear()]:'';
const cropsLine=i=>i.crops&&Object.keys(i.crops).length?'<div>Crops: '+Object.keys(i.crops).sort().reverse().map(y=>y+' '+esc(i.crops[y])+((i.varieties||{})[y]?' ('+esc(i.varieties[y])+')':'')).join(', ')+'</div>':'';
function redraw(){
  refreshYears();
  G.clearLayers();const used={},tot={},pins=[],best={};
  const vis=[];
  S.layers.forEach(l=>{if(!l.visible)return;S.items.filter(i=>i.layer===l.id&&(l.always||YR==='all'||yrOf(i)===+YR)).forEach(i=>vis.push([i,l]))});
  vis.forEach(([i])=>{if(i.type==='poly'&&i.group){const a=netArea(i);if(!best[i.group]||a>best[i.group].a)best[i.group]={a,i}}});
  vis.forEach(([i,l])=>{
    if(edit&&edit.it===i)return;
    if(i.type!=='poly'){pins.push({i,l});return}
    const cr=cropOf(i,l),col=cr?cropColor(cr):l.color;if(cr){used[cr]=col;tot[cr]=(tot[cr]||0)+netArea(i)}
    const m=L.polygon([i.pts].concat(holesOf(i).map(h=>h.pts)),{color:col,weight:3,fillOpacity:.25,interactive:false});
    let txt=null;
    if(i.group){if(best[i.group].i===i){const mm=members(i);txt=esc(i.group)+(cr?', '+esc(cr):'')+'<br>'+acOf(mm.reduce((a,x)=>a+netArea(x),0))+' ac'+(mm.length>1?', '+mm.length+' parts':'')}}
    else txt=esc(i.name)+(cr?', '+esc(cr):'')+'<br>'+acOf(netArea(i))+' ac';
    if(txt)m.bindTooltip(txt,{permanent:true,direction:'center',className:'lbl'});
    m.addTo(G);
    holesOf(i).forEach((h,hk)=>{const lab=h.name;if(lab)L.polygon(h.pts,{stroke:false,fill:false,interactive:false}).bindTooltip(esc(lab),{permanent:true,direction:'center',className:'lbl lbl2'}).addTo(G)});
  });
  /* pins: nearby ones in the same layer collapse into a numbered bubble */
  const z=map.getZoom(),cells={};
  const rs=S.round?new Set(S.round.spots):null,mkPin=(i,l,todo)=>{const m=L.marker(i.pos,{icon:L.divIcon({className:'',html:'<div class="pin'+(todo?' todo':'')+'" style="background:'+l.color+'">'+(i.photos&&i.photos.length?'📷':'')+'</div>',iconSize:[26,26],iconAnchor:[13,13]}),zIndexOffset:todo?500:0});m.bindPopup(()=>pop(i,l));m.addTo(G)};
  const rest=pins.filter(p=>!(rs&&rs.has(p.i.id)));pins.filter(p=>rs&&rs.has(p.i.id)).forEach(p=>mkPin(p.i,p.l,!S.round.done[p.i.id]));
  rest.forEach(p=>{const q=map.project(p.i.pos,z),k=p.l.id+':'+Math.floor(q.x/48)+':'+Math.floor(q.y/48);(cells[k]=cells[k]||[]).push(p)});
  Object.values(cells).forEach(c=>{
    if(c.length===1||z>=19){c.forEach(({i,l})=>mkPin(i,l,false));return}
    const lat=c.reduce((a,p)=>a+p.i.pos[0],0)/c.length,lng=c.reduce((a,p)=>a+p.i.pos[1],0)/c.length;

function handles(o){
  const pts=o.pts;o.poly.setLatLngs(pts);o.grp.clearLayers();
  const n=pts.length,show=()=>{$(o.info).innerHTML=topInfo(pts)};
  pts.forEach((p,i)=>{
    const m=L.marker(p,{draggable:true,icon:cornerIcon,zIndexOffset:500}).addTo(o.grp);
    m.on('drag',e=>{const q=e.target.getLatLng();pts[i]=[q.lat,q.lng];o.poly.setLatLngs(pts);show()});
    m.on('dragend',o.redo);
    if(o.removable)m.on('click',()=>{if(n>3&&confirm('Remove this corner?')){pts.splice(i,1);o.redo()}});
  });
  if(n>1)for(let i=0;i<(n>2?n:1);i++){
    const a=pts[i],b=pts[(i+1)%n],mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const px=map.latLngToContainerPoint(a).distanceTo(map.latLngToContainerPoint(b));
    if(px>70)L.marker(mid,{interactive:false,icon:L.divIcon({className:'',html:'<div class="sl">'+fmtFt(dist(a,b))+'</div>',iconSize:[0,0]})}).addTo(o.grp);
    const m=L.marker(mid,{draggable:true,icon:midIcon,zIndexOffset:400}).addTo(o.grp);

    m.on('drag',e=>{const q=e.target.getLatLng();pts[k]=[q.lat,q.lng];o.poly.setLatLngs(pts);show()});
    m.on('dragend',o.redo);
  }
  show();
}

function ptIn(p,q){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if((p[i][0]>q[0])!==(p[j][0]>q[0])&&q[1]<(p[j][1]-p[i][1])*(q[0]-p[i][0])/(p[j][0]-p[i][0])+p[i][1])c=!c}return c}
let lastHit=null;
function hitsAt(ll){
  const q=[ll.lat,ll.lng],out=[];
  S.layers.forEach(l=>{if(l.visible)S.items.forEach(i=>{if(i.layer===l.id&&i.type==='poly'&&(l.always||YR==='all'||yrOf(i)===+YR)&&ptIn(i.pts,q))out.push([i,l])})});
  return out;
}

    '<button class="go" style="width:100%;margin:8px 0" onclick="noteForm(\'\')">+ ADD NOTE</button>'+
    (list.length?list.map(n=>noteRow(n,true,true)).join(''):'<div class="small">'+(all.length?'No notes of this type.':'No notes yet. Tap + ADD NOTE and pick a field.')+'</div>')+
    '<div class="btns"><button class="go" onclick="closeSheet();showHome()">Close</button></div>');
}
function noteOpen(fid,id,home){nt.home=!!home;noteForm(fid,id)}
function noteForm(fid,id){
  const n=id?S.notes.find(x=>x.id===id):null;
  nt.fid=fid||'';nt.id=id||'';nt.photos=n?(n.photos||[]).slice():[];nt.type=n?n.type:'Other';nt.pin=n?!!n.pos:false;nt.rem=0;
  const rows=fieldRows(),sel=n?n.field:fid;
  open('<h2 style="margin:0">'+(n?'Edit note':'New note')+'</h2>'+
    '<label>Field</label><select id="ntfld"><option value="">Pick a field…</option>'+rows.map(r=>'<option value="'+r.i.id+'"'+(members(r.i).some(m=>m.id===sel)?' selected':'')+'>'+esc(r.name)+'</option>').join('')+'</select>'+
    '<label>Date</label><input type="date" id="ntd" value="'+esc(n&&n.date?n.date:today())+'">'+
    '<label>Type</label><div class="chips" id="ntt">'+NTYPES.map(t=>'<button data-t="'+t+'" class="'+(t===nt.type?'go':'')+'" onclick="ntType(\''+t+'\')">'+NICON[t]+' '+t+'</button>').join('')+'</div>'+
    '<label>Note</label><textarea id="ntx" rows="5" placeholder="What you did or saw…">'+esc(n?n.text:'')+'</textarea>'+
    '<label>Photos</label><div class="nph" id="ntp"></div><div class="small" id="nts" style="margin-bottom:4px"></div><input type="file" id="ntf" accept="image/*" multiple onchange="ntAddPics(this)" oninput="ntAddPics(this)"><div class="small" style="margin-top:8px">Or take a new photo:</div><input type="file" id="ntc" accept="image/*" capture="environment" onchange="ntAddPics(this)" oninput="ntAddPics(this)">'+
    '<label>Map pin</label><div class="chips"><button id="ntpin" onclick="ntPin()"></button></div>'+
    (n?'':'<label>Remind me</label><div class="chips" id="ntr">'+[[0,'No'],[3,'3 days'],[7,'1 week'],[10,'10 days'],[14,'2 weeks']].map(c=>'<button data-k="'+c[0]+'" class="'+(c[0]===0?'go':'')+'" onclick="ntRem('+c[0]+')">'+c[1]+'</button>').join('')+'</div>')+
    '<div class="btns">'+(n?'<button class="no" onclick="noteDel()">Delete</button>':'')+'<button onclick="noteBack()">Cancel</button><button class="go" id="ntsv" onclick="noteSave()">Save</button></div>');
  ntPics();ntPinLbl();
}
function ntType(t){nt.type=t;document.querySelectorAll('#ntt button').forEach(b=>b.classList.toggle('go',b.dataset.t===t))}
function ntRem(k){nt.rem=k;document.querySelectorAll('#ntr button').forEach(b=>b.classList.toggle('go',+b.dataset.k===k))}
function ntPics(){$('#ntp').innerHTML=nt.photos.map((p,k)=>'<div><img data-zoom="1" src="'+p+'"><button class="no" onclick="ntRm('+k+')">Remove</button></div>').join('')}
function ntRm(k){nt.photos.splice(k,1);ntPics()}
/* photos: try the normal way, then another decoder, then convert HEIC (Samsung/iPhone "high efficiency" photos) */
let heicP=null;
function loadHeic(){if(window.heic2any)return Promise.resolve();if(!heicP)heicP=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';sc.onload=ok;sc.onerror=()=>{heicP=null;no(new Error('load'))};document.head.appendChild(sc)});return heicP}
const isHeic=f=>/heic|heif/i.test((f.type||'')+' '+(f.name||''));
async function shrink(f){
  let d=await shrink0(f);if(d)return d;
  d=await shrink2(f);if(d&&d.length>100)return d;
  if(isHeic(f)||!f.type){try{await loadHeic();let o=await heic2any({blob:f,toType:'image/jpeg',quality:.7});if(Array.isArray(o))o=o[0];d=(await shrink0(o))||(await shrink2(o))}catch(e){d=null}}
  return d&&d.length>100?d:null;
}
/* second way to read a photo, for phones where the first one cannot decode it */
function shrink2(f){return new Promise(async r=>{try{
  let src;if(window.createImageBitmap){src=await createImageBitmap(f)}
  else{src=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(f)})}
  const w=src.width,h=src.height,k=Math.min(1,1000/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))}catch(e){r(null)}})}
let ntBusy=false;
async function ntAddPics(inp){
  if(ntBusy)return;const files=[...(inp.files||[])],st=$('#nts');
  if(!files.length){if(st)st.textContent='No photo was received. Try choosing it again.';return}
  ntBusy=true;if(st)st.textContent='Adding '+files.length+(files.length===1?' photo…':' photos…')+' (phone-format HEIC photos take a few seconds)';
  const bad=[];
  for(const f of files){let d=null;try{d=await shrink(f)}catch(e){}if(d&&d.length>100)nt.photos.push(d);else bad.push((f.name||'photo')+' ('+(f.type||'unknown type')+', '+Math.round((f.size||0)/1024)+' KB)')}
  try{inp.value=''}catch(e){}
  ntBusy=false;if($('#ntp'))ntPics();
  if($('#nts'))$('#nts').textContent=bad.length?'Could not read: '+bad.join('; ')+'. HEIC photos need an internet connection the first time. Try again, or take a new photo.':'Photo added. Tap Save to keep it on the note.';
}
function ntPin(){nt.pin=!nt.pin;ntPinLbl()}
function ntPinLbl(){$('#ntpin').textContent=nt.pin?'📍 Pin on map: ON (tap to remove)':'📍 Pin on map here';$('#ntpin').classList.toggle('go',nt.pin)}
function noteBack(){if(nt.home)notesAllSheet(nt.flt);else if(nt.fid&&S.items.some(x=>x.id===nt.fid))notesSheet(nt.fid,nt.flt);else notesAllSheet()}
function noteSave(){
  const fid=$('#ntfld').value;if(!fid){alert('Pick the field this note is for.');return}
  const f=S.items.find(x=>x.id===fid),text=$('#ntx').value.trim();
  if(!text&&!nt.photos.length){alert('Write a note or add a photo.');return}
  let n=nt.id&&S.notes.find(x=>x.id===nt.id);
  if(!n){n={id:uid(),t:Date.now()};S.notes.push(n)}
  const c=map.getCenter();
  Object.assign(n,{field:fid,date:$('#ntd').value||today(),type:nt.type,text,photos:nt.photos.slice(),pos:nt.pin?(n.pos||(gps?[gps.lat,gps.lng]:[c.lat,c.lng])):null});
  if(!nt.id&&nt.rem>0)S.tasks.push({id:uid(),created:today(),done:false,title:nt.type+': '+(text.split('\n')[0].slice(0,40)||'check field'),due:addDays(nt.rem),field:fid,fname:f?nameOf(f):'',note:''});
  nt.fid=fid;nt.id=n.id;save();drawNotes();noteBack();
}
function noteDel(){if(!confirm('Delete this note?'))return;S.notes=S.notes.filter(x=>x.id!==nt.id);save();drawNotes();noteBack()}
/* note pins on the map (follow the year box like other layers) */
const NG=L.layerGroup().addTo(map);
function drawNotes(){
  NG.clearLayers();
  (S.notes||[]).forEach(n=>{
    if(!n.pos)return;if(YR!=='all'&&n.date&&+n.date.slice(0,4)!==+YR)return;
    L.marker(n.pos,{icon:L.divIcon({className:'',html:'<div class="npin">'+(NICON[n.type]||'📝')+'</div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(NG)
     .on('click',()=>{if(draw||edit||pin||locMode)return;closeSheet();hideHome();noteOpen(n.field,n.id,false)});
  });
}

/* ===== plan: next year's crop plan, items grouped by crop/job, free-text note per item ===== */
let pl={y:'',id:'',group:'',fields:[],done:false,from:''};
const planDefYear=()=>{const d=new Date();return d.getMonth()>=7?d.getFullYear()+1:d.getFullYear()};
function planYears(){const ys=new Set(S.fplan.items.map(i=>i.y).concat(S.fplan.years||[]));ys.add(String(planDefYear()));return [...ys].sort()}
function planGroupsUsed(y){const g=S.fplan.groups.slice();S.fplan.items.filter(i=>i.y===y).forEach(i=>{if(!g.includes(i.group))g.push(i.group)});return g}
function planRow(it,first,last){
  const fl=(it.fields||[]).map(id=>{const f=S.items.find(x=>x.id===id);return f?'<span class="small">'+esc(nameOf(f))+'</span>':''}).filter(Boolean).join(' · ');
  return '<div class="pit'+(it.done?' done':'')+'"><button class="ck'+(it.done?' on':'')+'" onclick="planTick(\''+it.id+'\')">'+(it.done?'✓':'')+'</button>'+
    '<div class="pb" onclick="planOpen(\''+it.id+'\')"><div class="pt">'+esc(it.title)+'</div>'+(it.note?'<div class="pn">'+esc(it.note)+'</div>':'')+(fl?'<div>'+fl+'</div>':'')+'</div>'+
    '<div class="mvs"><button '+(first?'disabled style="opacity:.3"':'')+' onclick="planMove(\''+it.id+'\',-1)">▲</button><button '+(last?'disabled style="opacity:.3"':'')+' onclick="planMove(\''+it.id+'\',1)">▼</button></div></div>';
}
function planSheet(y){
  pl.y=String(y||pl.y||planDefYear());pl.from='';
  const its=S.fplan.items.filter(i=>i.y===pl.y),yrs=planYears();
  let body='';
  planGroupsUsed(pl.y).forEach(g=>{const gi=its.filter(i=>i.group===g);if(!gi.length)return;body+='<div class="pg">'+esc(g)+'</div>'+gi.map((it,k)=>planRow(it,k===0,k===gi.length-1)).join('')});
  open('<h2 style="margin:0">Plan · '+esc(pl.y)+'</h2><div class="small">'+its.length+(its.length===1?' item':' items')+(its.length?' · '+its.filter(i=>i.done).length+' done':'')+'</div>'+
    '<div class="chips">'+yrs.map(v=>'<button class="'+(v===pl.y?'go':'')+'" onclick="planSheet(\''+v+'\')">'+v+'</button>').join('')+'<button onclick="planAddYear()">+ Year</button></div>'+
    '<button class="go" style="width:100%;margin:6px 0" onclick="planForm(\'\')">+ ADD ITEM</button>'+
    (body||'<div class="small" style="padding:8px 0">Nothing planned for '+esc(pl.y)+' yet. Tap + ADD ITEM.</div>')+
    '<div class="two" style="margin-top:14px"><button onclick="planCopy()">Copy to '+(+pl.y+1)+'</button><button onclick="planGroupsSheet()">Groups</button></div>'+
    '<div class="btns"><button class="go" onclick="closeSheet();showHome()">Close</button></div>');
}
function planAddYear(){
  const ys=planYears(),v=prompt('Which year is the plan for?',String(+ys[ys.length-1]+1));if(!v)return;
  if(!/^20\d\d$/.test(v.trim())){alert('Type a four-digit year, like 2028.');return}
  if(!S.fplan.years.includes(v.trim()))S.fplan.years.push(v.trim());save();planSheet(v.trim());
}
function planTick(id){const it=S.fplan.items.find(x=>x.id===id);if(!it)return;it.done=!it.done;save();if(pl.from)fieldSheet(pl.from);else planSheet(it.y)}
function planMove(id,d){
  const it=S.fplan.items.find(x=>x.id===id);if(!it)return;
  const grp=S.fplan.items.filter(x=>x.y===it.y&&x.group===it.group),k=grp.indexOf(it),o=grp[k+d];if(!o)return;
  const A=S.fplan.items,a=A.indexOf(it),b=A.indexOf(o);A[a]=o;A[b]=it;save();planSheet(it.y);
}
function planOpen(id,fid){pl.from=fid||'';planForm(id)}
function planGrpChips(){$('#pgc').innerHTML=planGroupsUsed(pl.y).map((g,i)=>'<button class="'+(g===pl.group?'go':'')+'" onclick="planGrp('+i+')">'+esc(g)+'</button>').join('')+'<button onclick="planNewGroup()">+ New</button>'}
function planGrp(i){pl.group=planGroupsUsed(pl.y)[i];planGrpChips()}
function planNewGroup(){
  const n=(prompt('Name of the new group (for example Peas or Fertilizer)')||'').trim();if(!n)return;
  const ex=planGroupsUsed(pl.y).find(g=>g.toLowerCase()===n.toLowerCase());
  if(ex)pl.group=ex;else{S.fplan.groups.push(n);pl.group=n;save()}
  planGrpChips();
}
function planFldChips(){const rows=fieldRows();$('#pfc').innerHTML=rows.length?rows.map(r=>'<button class="'+(pl.fields.includes(r.i.id)?'go':'')+'" onclick="planFld(\''+r.i.id+'\')">'+esc(r.name)+'</button>').join(''):'<div class="small">Draw your fields first, then you can tag them here.</div>'}
function planFld(id){const k=pl.fields.indexOf(id);if(k<0)pl.fields.push(id);else pl.fields.splice(k,1);planFldChips()}
function planDone(v){pl.done=v;document.querySelectorAll('#pdn button').forEach(b=>b.classList.toggle('go',(b.dataset.v==='1')===v))}
function planForm(id){
  const it=id?S.fplan.items.find(x=>x.id===id):null;
  if(it)pl.y=it.y;
  pl.id=id||'';pl.group=it?it.group:(pl.group&&planGroupsUsed(pl.y).includes(pl.group)?pl.group:S.fplan.groups[0]);pl.fields=it?(it.fields||[]).slice():[];pl.done=it?!!it.done:false;
  open('<h2 style="margin:0">'+(it?'Edit item':'New item')+' · '+esc(pl.y)+'</h2>'+
    '<label>Title</label><input type="text" id="ptl" value="'+esc(it?it.title:'')+'" placeholder="e.g. Spraying order">'+
    '<label>Group</label><div class="chips" id="pgc"></div>'+
    '<label>Note</label><textarea id="ptx" rows="6" placeholder="Write the plan in your own words">'+esc(it?it.note:'')+'</textarea>'+
    '<label>Fields this is about (optional)</label><div class="chips" id="pfc"></div>'+
    '<label>Done?</label><div class="chips" id="pdn"><button data-v="0" class="'+(pl.done?'':'go')+'" onclick="planDone(false)">Not yet</button><button data-v="1" class="'+(pl.done?'go':'')+'" onclick="planDone(true)">Done</button></div>'+
    '<div class="btns">'+(it?'<button class="no" onclick="planDel()">Delete</button>':'')+'<button onclick="planBack()">Cancel</button><button class="go" onclick="planSave()">Save</button></div>');
  planGrpChips();planFldChips();
}
function planBack(){if(pl.from&&S.items.some(x=>x.id===pl.from))fieldSheet(pl.from);else planSheet(pl.y)}
function planSave(){
  const title=$('#ptl').value.trim();if(!title){alert('Give the item a short title.');return}
  let it=pl.id&&S.fplan.items.find(x=>x.id===pl.id);
  if(!it){it={id:uid(),y:pl.y,t:Date.now()};S.fplan.items.push(it)}
  Object.assign(it,{title,group:pl.group,note:$('#ptx').value.trim(),fields:pl.fields.slice(),done:pl.done});
  save();planBack();
}
function planDel(){if(!confirm('Delete this plan item?'))return;S.fplan.items=S.fplan.items.filter(x=>x.id!==pl.id);save();planBack()}
function planCopy(){
  const src=S.fplan.items.filter(i=>i.y===pl.y),to=String(+pl.y+1);
  if(!src.length){alert('There is nothing in '+pl.y+' to copy yet.');return}
  const have=S.fplan.items.filter(i=>i.y===to).length;
  if(!confirm('Copy '+src.length+' items from '+pl.y+' to '+to+'? Ticks are cleared.'+(have?' '+to+' already has '+have+' items; these are added after them.':'')))return;
  src.forEach(i=>S.fplan.items.push({...i,id:uid(),y:to,done:false,fields:(i.fields||[]).slice(),t:Date.now()}));
  if(!S.fplan.years.includes(to))S.fplan.years.push(to);save();planSheet(to);
}
function planGroupsSheet(){
  open('<h2 style="margin:0">Plan groups</h2><div class="small">Rename, add or remove the headings in your plan.</div>'+
    S.fplan.groups.map((g,i)=>'<div class="orow"><b>'+esc(g)+'</b> <span class="small">'+S.fplan.items.filter(x=>x.group===g).length+' items</span><div class="two" style="margin-top:6px"><button onclick="planGrpRename('+i+')">Rename</button><button class="no" onclick="planGrpDel('+i+')">Remove</button></div></div>').join('')+
    '<button class="go" style="width:100%;margin:12px 0 0" onclick="planGrpAdd()">+ Add group</button><div class="btns"><button class="go" onclick="planSheet()">Back</button></div>');
}
function planGrpAdd(){const n=(prompt('Name of the new group')||'').trim();if(!n)return;if(!S.fplan.groups.some(g=>g.toLowerCase()===n.toLowerCase())){S.fplan.groups.push(n);save()}planGroupsSheet()}
function planGrpRename(i){
  const old=S.fplan.groups[i],n=(prompt('New name for "'+old+'"',old)||'').trim();if(!n||n===old)return;
  if(S.fplan.groups.some((g,k)=>k!==i&&g.toLowerCase()===n.toLowerCase())){alert('A group with that name already exists.');return}
  S.fplan.groups[i]=n;S.fplan.items.forEach(x=>{if(x.group===old)x.group=n});save();planGroupsSheet();
}
function planGrpDel(i){
  const g=S.fplan.groups[i],n=S.fplan.items.filter(x=>x.group===g).length;
  if(S.fplan.groups.length<2){alert('Keep at least one group.');return}
  if(!confirm('Remove the group "'+g+'"?'+(n?' Its '+n+' items move to another group.':'')))return;
  S.fplan.groups.splice(i,1);const to=S.fplan.groups.includes('Other')?'Other':S.fplan.groups[0];
  S.fplan.items.forEach(x=>{if(x.group===g)x.group=to});save();planGroupsSheet();
}
function planFieldHtml(f){
  const ids=new Set(members(f).map(m=>m.id)),its=S.fplan.items.filter(i=>(i.fields||[]).some(x=>ids.has(x)));if(!its.length)return '';
  const y=its.map(i=>i.y).sort().pop(),show=its.filter(i=>i.y===y);
  return '<h3>Plan for '+esc(y)+'</h3>'+show.map(i=>'<div class="nrow" onclick="planOpen(\''+i.id+'\',\''+f.id+'\')"><b>'+(i.done?'✓ ':'')+esc(i.title)+'</b> <span class="small">'+esc(i.group)+'</span>'+(i.note?'<div class="nt">'+esc(i.note)+'</div>':'')+'</div>').join('');
}
load().then(d=>{if(d)S=d;migrate();applyBase();redraw();zoomAll();showHome()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
