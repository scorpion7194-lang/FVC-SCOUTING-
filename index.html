<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fairview Scouting</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d6a3e">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#1c2b1f;--paper:#f6f4ec;--acc:#2d6a3e;--line:#cfcab8;--warn:#b3402a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:16px/1.4 system-ui,sans-serif;color:var(--ink);background:var(--paper)}
#map{position:absolute;inset:0}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:1000;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:2px solid var(--ink)}
.bar button,.sheet button{flex:1;min-height:48px;font:600 15px system-ui;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:8px;padding:0 8px}
button.go{background:var(--acc);color:#fff;border-color:var(--acc)}
button.no{color:var(--warn);border-color:var(--warn)}
#dinfo,#einfo{flex:2;align-self:center;font-weight:700;text-align:center}
.hide{display:none!important}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1100;max-height:85%;overflow:auto;background:var(--paper);border-top:3px solid var(--ink);padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font-size:20px}
.sheet label{display:block;font-weight:600;margin:10px 0 3px}
.sheet input[type=text],.sheet input[type=date],.sheet select,.sheet textarea{width:100%;font:16px system-ui;padding:10px;border:2px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row input[type=text]{flex:1}
.row input[type=color]{width:44px;height:44px;border:2px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.row input[type=checkbox],.row input[type=radio]{width:24px;height:24px}
.row button{flex:none;min-height:44px}
.btns{display:flex;gap:8px;margin-top:14px}
.pin{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #000;font-size:13px;line-height:20px;text-align:center}
.lbl{background:rgba(0,0,0,.65);border:0;color:#fff;font-weight:700;box-shadow:none}
.lbl:before{display:none}
.me{background:#1a73e8;border:3px solid #fff;border-radius:50%}
.pop img{max-width:200px;display:block;margin:6px 0;border-radius:6px}
.small{font-size:13px;color:#555}
#fab{position:absolute;right:12px;top:calc(80px + env(safe-area-inset-top,0px));z-index:1000;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
#yr{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:1000;font:700 16px system-ui;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
#legend{position:absolute;left:12px;top:calc(68px + env(safe-area-inset-top,0px));z-index:900;background:rgba(255,255,255,.9);border-radius:8px;font:600 13px system-ui}
#legend:empty{display:none}
#legend div{padding:4px 10px;display:flex;align-items:center;gap:6px}
#legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.lbl{text-align:center}
#fab2{position:absolute;right:12px;top:calc(144px + env(safe-area-inset-top,0px));z-index:1000;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.bub{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);color:#fff;font:700 15px/32px system-ui;text-align:center;text-shadow:0 0 3px #000}
.lbl2{font-size:12px;background:rgba(150,30,30,.8)}
.orow{border-top:1px solid var(--line);padding:10px 0}
.orow img{width:72px;height:72px;object-fit:cover;border-radius:6px;margin:6px 6px 0 0}
#lb{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:14px system-ui}
#lb img{max-width:100%;max-height:90%;object-fit:contain}
.ph{display:inline-block;margin:8px 8px 0 0;vertical-align:top;width:140px}
.ph img{width:140px;height:140px;object-fit:cover;border-radius:8px;display:block}
.ph button{width:100%;min-height:36px;margin-top:4px;font-size:14px}
.pop img[data-zoom]{cursor:zoom-in}
#fabH{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:1000;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
#home{position:fixed;inset:0;z-index:2000;background:var(--paper);overflow:auto;display:flex;flex-direction:column}
.hhead{background:var(--ink);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 0}
.hname{font:700 26px/1.15 system-ui}
.hsub{opacity:.8;margin:2px 0 12px}
.hhead svg{display:block;margin:0 -18px;width:calc(100% + 36px)}
.hstats{display:flex;gap:8px;padding:14px 14px 4px}
.stat{flex:1;display:flex;flex-direction:column}
.stat b{font:700 28px/1 system-ui}
.stat span{font-size:13px;color:#555;margin-top:2px}
.htiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px}
.htiles button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:14px 12px;min-height:112px;font:inherit}
.htiles svg{width:34px;height:34px;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--acc);margin-bottom:6px}
.htiles b{font-size:18px}
.htiles span{font-size:13px;color:#555;line-height:1.25}
.hlink{margin:2px 14px 0;min-height:48px;border:2px solid var(--ink);background:transparent;border-radius:10px;font:600 15px system-ui;color:var(--ink)}
.hnote{padding:10px 14px calc(18px + env(safe-area-inset-bottom,0px));font-size:13px;color:#555}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.sheet .tiles button{flex:none;min-height:84px;color:#fff;border:0;border-radius:12px;font:700 15px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.tiles .e{font-size:28px;line-height:1.1}
.tiles.has button:not(.on){opacity:.4}
.tiles button.on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
.seg,.two{display:flex;gap:8px}
.sheet .seg button.on{background:var(--ink);color:#fff}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.sheet .fgrid button{min-height:52px}
.sheet button.blue{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
.notebox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0}
.sheet h3{margin:14px 0 2px;font-size:16px}
#drawbar{flex-direction:column}
#drawbar .r{display:flex;gap:6px}
#drawbar button{font-size:14px;padding:0 4px}
#dinfo,#einfo{position:fixed;top:0;left:0;right:0;z-index:1000;flex:none;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:rgba(28,43,31,.92);color:#fff;font-size:18px;font-weight:400;text-align:center}
#dinfo span,#einfo span{margin:0 10px}
.sl{position:absolute;transform:translate(-50%,-26px);background:rgba(0,0,0,.7);color:#fff;font:600 13px system-ui;padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none}
button.on{background:var(--ink)!important;color:#fff!important}
#xh{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:900;pointer-events:none;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000}
#xh:before,#xh:after{content:'';position:absolute;background:#fff;box-shadow:0 0 0 1px #000}
#xh:before{left:50%;top:-14px;bottom:-14px;width:2px;margin-left:-1px}
#xh:after{top:50%;left:-14px;right:-14px;height:2px;margin-top:-1px}
.vh{width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid #000;box-sizing:border-box}
.mh{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #000;box-sizing:border-box;opacity:.85}
.pop button.hit{display:block;width:100%;text-align:left;margin:6px 0 0;padding:6px 10px}
.pop button{min-height:40px;border:2px solid var(--ink);background:#fff;border-radius:8px;padding:0 10px;margin:6px 4px 0 0;font-weight:600}
</style>
</head>
<body>
<div id="map"></div>

<div id="home">
  <div class="hhead">
    <div class="hname">Fairview Colony Farms</div>
    <div class="hsub">Crop scouting and field records</div>
    <svg viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice" width="100%" height="120" aria-hidden="true"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2b1f"/><stop offset=".55" stop-color="#8f9a52"/><stop offset="1" stop-color="#f0d98a"/></linearGradient></defs><rect width="400" height="120" fill="url(#sk)"/><circle cx="318" cy="70" r="20" fill="#fff3c4" opacity=".9"/><path d="M0 80 C80 60 150 64 230 76 S350 72 400 62 V120 H0Z" fill="#d9b94a"/><path d="M0 98 C90 80 170 86 250 94 S360 90 400 82 V120 H0Z" fill="#6aa23f"/><g stroke="#4f8a30" stroke-width="2" fill="none" opacity=".7"><path d="M0 106 C100 92 200 98 400 92"/><path d="M0 114 C100 102 220 108 400 102"/></g><g stroke="#b8982f" stroke-width="2" fill="none" opacity=".7"><path d="M0 88 C90 72 170 76 250 84 S360 80 400 72"/></g><rect x="52" y="66" width="22" height="14" fill="#b23a2e"/><path d="M49 66 L63 56 L77 66Z" fill="#8f2b22"/></svg>
  </div>
  <div class="hstats" id="hstats"></div>
  <div class="htiles">
    <button data-go="map"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><b>Field Map</b><span>Your fields and pins</span></button>
    <button data-go="scout"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><b>Scout Field</b><span>Weeds, disease, insects, photos</span></button>
    <button data-go="soil"><svg viewBox="0 0 24 24"><path d="M12 3v13M8 7h8M12 16v4"/><path d="M4 21h16"/></svg><b>Soil Sample</b><span>Drop a sample point</span></button>
    <button data-go="draw"><svg viewBox="0 0 24 24"><path d="M5 8l6-4 8 4 1 8-8 4-7-5z"/></svg><b>Draw / Measure</b><span>Fields, patches, manure</span></button>
    <button data-go="obs"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg><b>Observations</b><span>Everything you scouted</span></button>
    <button data-go="fields"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg><b>Field Records</b><span>Crop, acres, history</span></button>
  </div>
  <button class="hlink" data-go="layers">Layers, backup and restore</button>
  <div class="hnote">Everything is saved on this phone. Back up now and then.</div>
</div>

<div class="bar" id="main">
  <button id="bLayers">Layers</button>
  <button id="bDraw">Draw / measure</button>
  <button id="bObs" class="go">Scout</button>
  <button id="bPt">Soil point</button>
</div>

<button id="fabH" aria-label="Home"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1c2b1f" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
<button id="fab" aria-label="My location"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1c2b1f" stroke-width="2"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5" fill="#1c2b1f"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg></button>
<select id="yr" aria-label="Year"></select>
<div id="legend"></div>
<button id="fab2" aria-label="Observations list"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1c2b1f" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="#1c2b1f"/><circle cx="4" cy="12" r="1" fill="#1c2b1f"/><circle cx="4" cy="18" r="1" fill="#1c2b1f"/></svg></button>
<div id="lb" class="hide" onclick="this.classList.add('hide')"><img id="lbimg" alt=""><div>Tap anywhere to close</div></div>
<div id="xh" class="hide"></div>
<div class="bar hide" id="drawbar">
  <div id="dinfo"></div>
  <div class="r"><button id="dCancel" class="no">Cancel</button><button id="dUndo">Undo</button><button id="dDone" class="go">Finish</button></div>
  <div class="r"><button id="dXh">Crosshair</button><button id="dDrop" class="go hide">Drop point</button><button id="dGps">+ GPS</button><button id="dWalk">Walk</button></div>
</div>

<div class="bar hide" id="editbar">
  <button id="eCancel" class="no">Cancel</button>
  <div id="einfo"></div>
  <button id="eDone" class="go">Save corners</button>
</div>

<div class="bar hide" id="locbar"><button id="lCancel" class="no">Cancel</button><button id="lSet" class="go">Set location here</button></div>

<div class="bar hide" id="pinbar"><button id="pCancel" class="no">Done</button><button id="pGps">At my location</button><button id="pDrop" class="go">Drop at crosshair</button></div>

<div class="sheet hide" id="sheet"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let locMode=false,sc=null,fcard='';
let S={layers:[{id:'L1',name:'Fields',color:'#f2c94c',visible:true},{id:'L2',name:'Scouting notes',color:'#35a7ff',visible:true}],items:[],active:'L1',obsLayer:'L2'};

/* storage: IndexedDB so photos don't hit the small localStorage limit */
const DB=new Promise(r=>{try{const q=indexedDB.open('scout',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function load(){try{const d=await DB;return await new Promise(r=>{const q=d.transaction('s').objectStore('s').get('state');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}}
async function save(){try{const d=await DB;d.transaction('s','readwrite').objectStore('s').put(S,'state')}catch(e){}}

/* map */
const map=L.map('map',{zoomControl:false}).setView([51.40,-113.80],11);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri World Imagery'}).addTo(map);
const G=L.layerGroup().addTo(map);

/* area on a sphere, square metres */
function area(p){if(p.length<3)return 0;const R=6378137,r=Math.PI/180;let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=(b[1]-a[1])*r*(2+Math.sin(a[0]*r)+Math.sin(b[0]*r))}return Math.abs(s*R*R/2)}
function dist(a,b){const r=Math.PI/180,R=6371008,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r,x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const per=p=>{let t=0;for(let i=0;i<p.length;i++)t+=dist(p[i],p[(i+1)%p.length]);return t};
const fmtLen=m=>{const f=m*3.28084;return f>=1320?(f/5280).toFixed(2)+' mi':Math.round(f)+' ft'};
const holesOf=i=>i.holes||[];
const netArea=i=>area(i.pts)-holesOf(i).reduce((a,h)=>a+area(h.pts),0);
const members=i=>i.group?S.items.filter(x=>x.type==='poly'&&x.group===i.group):[i];
const acOf=a=>(a/4046.856).toFixed(1);
function polyInfo(i){
  let h='<div>'+fmt(netArea(i))+', perimeter '+fmtLen(per(i.pts))+(holesOf(i).length?' (after cutouts)':'')+'</div>';
  if(i.group){const mm=members(i);h+='<div>Farmed as <b>'+esc(i.group)+'</b>: '+mm.length+' part'+(mm.length>1?'s':'')+', '+acOf(mm.reduce((a,x)=>a+netArea(x),0))+' ac total</div>'}
  holesOf(i).forEach((hh,k)=>{h+='<div class="small">Cutout '+esc(hh.name||'')+', '+(area(hh.pts)/4046.856).toFixed(2)+' ac <button onclick="delHole(\''+i.id+'\','+k+')">Remove</button></div>'});
  return h;
}
const fm=p=>fmt(area(p))+', perimeter '+fmtLen(per(p));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const fmt=m=>(m/4046.856).toFixed(2)+' ac ('+(m/10000).toFixed(2)+' ha)';

/* GPS */
let gps=null,meMk=null,watching=false,walk=false,xhOn=false;
function startGps(cb){
  if(!navigator.geolocation){alert('This browser has no GPS access.');return}
  if(watching){if(gps&&cb)cb();return}
  watching=true;
  navigator.geolocation.watchPosition(p=>{
    const first=!gps;gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
    if(!meMk)meMk=L.marker([gps.lat,gps.lng],{icon:L.divIcon({className:'',html:'<div class="me" style="width:18px;height:18px"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false}).addTo(map);
    else meMk.setLatLng([gps.lat,gps.lng]);
    if(walk&&draw)walkPt();
    scGpsUpdate();
    if(first){map.setView([gps.lat,gps.lng],17);if(cb)cb()}
  },e=>{watching=false;alert('Could not get location: '+e.message+'\nGPS needs the page to be opened over https and location allowed.')},{enableHighAccuracy:true,maximumAge:2000});
}
const goMe=()=>{if(gps)map.setView([gps.lat,gps.lng],Math.max(map.getZoom(),17));else startGps()};
$('#fab').onclick=goMe;

/* sheets */
const sheet=$('#sheet');
function open(html){sheet.innerHTML=html;sheet.classList.remove('hide');$('#main').classList.add('hide')}
function closeSheet(){sheet.classList.add('hide');sheet.innerHTML='';if(!draw&&!pin&&!locMode)$('#main').classList.remove('hide');if(pin)$('#pinbar').classList.remove('hide')}
const layerOpts=sel=>S.layers.map(l=>'<option value="'+l.id+'"'+(l.id===sel?' selected':'')+'>'+esc(l.name)+'</option>').join('');

/* layers */
function layersSheet(){
  open('<h2>Layers</h2><div class="small">Tap the circle to choose the layer you are drawing into.</div>'+'<label style="display:flex;gap:8px;align-items:center;font-weight:400;margin:8px 0"><input type="checkbox" style="width:22px;height:22px" '+(S.byCrop!==false?'checked':'')+' onchange="S.byCrop=this.checked;save();redraw()">Colour fields by crop</label>'+cropColorRows()+
  S.layers.map(l=>'<div class="row"><input type="checkbox" '+(l.visible?'checked':'')+' onchange="lyr(\''+l.id+'\',\'visible\',this.checked)">'+
  '<input type="color" value="'+l.color+'" onchange="lyr(\''+l.id+'\',\'color\',this.value)">'+
  '<input type="text" value="'+esc(l.name)+'" onchange="lyr(\''+l.id+'\',\'name\',this.value)">'+
  '<input type="radio" name="act" '+(S.active===l.id?'checked':'')+' onchange="S.active=\''+l.id+'\';save()">'+
  '<button class="no" onclick="delLayer(\''+l.id+'\')">✕</button></div><label style="display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px;margin:0 0 8px 40px"><input type="checkbox" style="width:20px;height:20px" '+(l.always?'checked':'')+' onchange="lyr(\''+l.id+'\',\'always\',this.checked)">Show in every year</label>').join('')+
  '<h2 style="margin-top:18px">Add layer</h2><div class="row"><input type="color" id="nc" value="#e5484d"><input type="text" id="nn" placeholder="e.g. Wild oat patch"><button class="go" onclick="addLayer()">Add</button></div>'+
  '<div class="btns"><button onclick="backupData()">Back up</button><button onclick="restoreData()">Restore</button><button class="go" onclick="closeSheet()">Done</button></div>');
}
function lyr(id,k,v){const l=S.layers.find(x=>x.id===id);l[k]=v;save();redraw()}
function addLayer(){const n=$('#nn').value.trim();if(!n)return;const l={id:uid(),name:n,color:$('#nc').value,visible:true,always:false};S.layers.push(l);S.active=l.id;save();layersSheet();redraw()}

/* render */
let YR=String(new Date().getFullYear());
const yrOf=i=>i.date?+i.date.slice(0,4):new Date(i.t).getFullYear();
function refreshYears(){
  const ys=new Set([new Date().getFullYear()]);S.items.forEach(i=>ys.add(yrOf(i)));if(YR!=='all')ys.add(+YR);
  $('#yr').innerHTML=[...ys].sort((x,y)=>y-x).map(y=>'<option value="'+y+'">'+y+'</option>').join('')+'<option value="all">All years</option>';
  $('#yr').value=YR;
}
$('#yr').onchange=()=>{YR=$('#yr').value;redraw()};
function migrate(){S.layers.forEach(l=>{if(l.always===undefined)l.always=/^(fields|soil samples)$/i.test((l.name||'').trim())})}
const CROPC={wheat:'#d64545',barley:'#43a047',canola:'#f2c94c',oats:'#fb8c00',peas:'#26a69a',silage:'#8e24aa',hay:'#1e88e5',alfalfa:'#1e88e5',fallow:'#9e9e9e',flax:'#5c6bc0',corn:'#cddc39',lentil:'#a1887f'};
function cropColor(c){const k=c.toLowerCase().trim();if(S.cropColors&&S.cropColors[k])return S.cropColors[k];for(const n in CROPC)if(k.includes(n))return CROPC[n];let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))%360;return 'hsl('+h+',55%,45%)'}
const DEFCROPS=['Wheat','Barley','Canola','Oats','Peas','Silage','Hay','Fallow','Flax','Lentils'];
function cropNames(){const m={};DEFCROPS.forEach(c=>m[c.toLowerCase()]=c);S.items.forEach(i=>Object.values(i.crops||{}).forEach(c=>{const k=c.toLowerCase().trim();if(k&&!m[k])m[k]=c.trim()}));return Object.values(m)}
function hex(c){const x=document.createElement('canvas').getContext('2d');x.fillStyle=c;return x.fillStyle}
function cropColorRows(){
  return '<h2 style="margin-top:16px;font-size:17px">Crop colours</h2><div class="small">Pick the colour each crop shows on the map.</div>'+
  cropNames().map(c=>'<div class="row"><input type="color" value="'+hex(cropColor(c))+'" onchange="setCropColor(\''+encodeURIComponent(c)+'\',this.value)"><div style="flex:1;font-weight:600">'+esc(c)+'</div></div>').join('');
}
function setCropColor(n,v){S.cropColors=S.cropColors||{};S.cropColors[decodeURIComponent(n).toLowerCase().trim()]=v;save();redraw()}
const cropYear=()=>YR==='all'?String(new Date().getFullYear()):YR;
const cropOf=(i,l)=>S.byCrop!==false&&l.always&&i.crops?i.crops[cropYear()]:'';
const cropsLine=i=>i.crops&&Object.keys(i.crops).length?'<div>Crops: '+Object.keys(i.crops).sort().reverse().map(y=>y+' '+esc(i.crops[y])).join(', ')+'</div>':'';
function redraw(){
  refreshYears();
  G.clearLayers();const used={},pins=[],best={},pu={};
  const vis=[];
  S.layers.forEach(l=>{if(!l.visible)return;S.items.filter(i=>i.layer===l.id&&(l.always||YR==='all'||yrOf(i)===+YR)).forEach(i=>vis.push([i,l]))});
  vis.forEach(([i])=>{if(i.type==='poly'&&i.group){const a=netArea(i);if(!best[i.group]||a>best[i.group].a)best[i.group]={a,i}}});
  vis.forEach(([i,l])=>{
    if(edit&&edit.it===i)return;
    if(i.type!=='poly'){pins.push({i,l});pu[l.name]=l.color;return}
    const cr=cropOf(i,l),col=cr?cropColor(cr):l.color;if(cr)used[cr]=col;
    const m=L.polygon([i.pts].concat(holesOf(i).map(h=>h.pts)),{color:col,weight:3,fillOpacity:.25,interactive:false});
    let txt=null;
    if(i.group){if(best[i.group].i===i){const mm=members(i);txt=esc(i.group)+(cr?', '+esc(cr):'')+'<br>'+acOf(mm.reduce((a,x)=>a+netArea(x),0))+' ac'+(mm.length>1?', '+mm.length+' parts':'')}}
    else txt=esc(i.name)+(cr?', '+esc(cr):'')+'<br>'+acOf(netArea(i))+' ac';
    if(txt)m.bindTooltip(txt,{permanent:true,direction:'center',className:'lbl'});
    m.addTo(G);
    holesOf(i).forEach(h=>{if(h.name)L.polygon(h.pts,{stroke:false,fill:false,interactive:false}).bindTooltip(esc(h.name),{permanent:true,direction:'center',className:'lbl lbl2'}).addTo(G)});
  });
  /* pins: nearby ones in the same layer collapse into a numbered bubble */
  const z=map.getZoom(),cells={};
  pins.forEach(p=>{const q=map.project(p.i.pos,z),k=p.l.id+':'+Math.floor(q.x/48)+':'+Math.floor(q.y/48);(cells[k]=cells[k]||[]).push(p)});
  Object.values(cells).forEach(c=>{
    if(c.length===1||z>=19){c.forEach(({i,l})=>{const m=L.marker(i.pos,{icon:L.divIcon({className:'',html:'<div class="pin" style="background:'+l.color+'">'+(i.photos&&i.photos.length?'📷':'')+'</div>',iconSize:[26,26],iconAnchor:[13,13]})});m.bindPopup(()=>pop(i,l));m.addTo(G)});return}
    const lat=c.reduce((a,p)=>a+p.i.pos[0],0)/c.length,lng=c.reduce((a,p)=>a+p.i.pos[1],0)/c.length;
    const mk=L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="bub" style="background:'+c[0].l.color+'">'+c.length+'</div>',iconSize:[38,38],iconAnchor:[19,19]})}).addTo(G);
    mk.on('click',()=>map.fitBounds(L.latLngBounds(c.map(p=>p.i.pos)),{padding:[70,70],maxZoom:19}));
  });
  $('#legend').innerHTML=Object.keys(used).sort().map(c=>'<div><i style="background:'+used[c]+'"></i>'+esc(c)+'</div>').join('')+Object.keys(pu).sort().map(c=>'<div><i style="background:'+pu[c]+';border-radius:50%"></i>'+esc(c)+'</div>').join('');
}
function pop(i,l){
  let h='<div class="pop"><b>'+esc(i.type==='obs'?obsLine1(i):(i.name||i.stage||'Note'))+'</b><div class="small">'+esc(l.name)+' · '+(i.type==='obs'&&(i.date||i.t)?dlabel(dkey(i)):new Date(i.t).toLocaleString())+'</div>';
  if(i.type==='poly')h+=polyInfo(i)+cropsLine(i)+(i.date?'<div>Date: '+new Date(i.date+'T12:00').toLocaleDateString()+'</div>':'')+(i.note?'<div>'+esc(i.note)+'</div>':'');
  else{if(i.type==='obs'){const f=fieldOf(i.pos);if(f)h+='<div>Field: '+esc(nameOf(f))+'</div>'}if(i.sev)h+='<div>Severity: '+esc(i.sev)+'</div>';if(i.crop)h+='<div>Crop: '+esc(i.crop)+'</div>';if(i.depth)h+='<div>Depth: '+esc(i.depth)+'</div>';if(i.date)h+='<div>Date: '+new Date(i.date+'T12:00').toLocaleDateString()+'</div>';if(i.stage)h+='<div>Stage: '+esc(i.stage)+'</div>';if(i.note)h+='<div>'+esc(i.note)+'</div>';
    h+='<div class="small">'+i.pos[0].toFixed(5)+', '+i.pos[1].toFixed(5)+(i.acc?' (±'+Math.round(i.acc)+' m)':'')+'</div>';
    (i.photos||[]).forEach(p=>h+='<img data-zoom="1" src="'+p+'">')}
  if(i.type==='poly')h+='<button onclick="editItem(\''+i.id+'\')">Edit corners</button><button onclick="detailsSheet(\''+i.id+'\')">Details</button><button onclick="startCutout(\''+i.id+'\')">Cut out</button><button onclick="copyItem(\''+i.id+'\')">Copy</button><button onclick="historySheet(\''+i.id+'\')">History</button>';
  if(i.type==='pt'||i.type==='obs')h+='<button onclick="detailsSheet(\''+i.id+'\')">Details</button>';
  return h+'<button class="no" onclick="delItem(\''+i.id+'\')">Delete</button></div>';
}
function delItem(id){if(!confirm('Delete this item?'))return;S.items=S.items.filter(i=>i.id!==id);map.closePopup();save();redraw()}

/* draw / measure */
let draw=null;
/* corner dots (drag to move), small middle dots (drag out to add a corner), side lengths */
const cornerIcon=L.divIcon({className:'',html:'<div class="vh"></div>',iconSize:[28,28],iconAnchor:[14,14]});
const midIcon=L.divIcon({className:'',html:'<div class="mh"></div>',iconSize:[18,18],iconAnchor:[9,9]});
const fmtFt=m=>{const f=m*3.28084;return (f>=100?Math.round(f):f.toFixed(1))+' ft'};
function handles(o){
  const pts=o.pts;o.poly.setLatLngs(pts);o.grp.clearLayers();
  const n=pts.length,show=()=>{$(o.info).innerHTML=topInfo(pts)};
  pts.forEach((p,i)=>{
    const m=L.marker(p,{draggable:true,icon:cornerIcon,zIndexOffset:500}).addTo(o.grp);
    m.on('drag',e=>{const q=e.target.getLatLng();pts[i]=[q.lat,q.lng];o.poly.setLatLngs(pts);show()});
    m.on('dragend',o.redo);
    if(o.removable)m.on('click',()=>{if(n>3&&confirm('Remove this corner?')){pts.splice(i,1);o.redo()}});
  });
  if(n>1)for(let i=0;i<(n>2?n:1);i++){
    const a=pts[i],b=pts[(i+1)%n],mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const px=map.latLngToContainerPoint(a).distanceTo(map.latLngToContainerPoint(b));
    if(px>70)L.marker(mid,{interactive:false,icon:L.divIcon({className:'',html:'<div class="sl">'+fmtFt(dist(a,b))+'</div>',iconSize:[0,0]})}).addTo(o.grp);
    const m=L.marker(mid,{draggable:true,icon:midIcon,zIndexOffset:400}).addTo(o.grp);
    let k;
    m.on('dragstart',e=>{k=i+1;pts.splice(k,0,mid.slice())});
    m.on('drag',e=>{const q=e.target.getLatLng();pts[k]=[q.lat,q.lng];o.poly.setLatLngs(pts);show()});
    m.on('dragend',o.redo);
  }
  show();
}
map.on('zoomend',()=>{if(draw)upd();else if(edit)eupd();redraw()});
map.on('popupopen',()=>{if(draw||edit)map.closePopup()});
const topInfo=p=>p.length<3?'Tap corners ('+p.length+')':'<span>Area <b>'+(area(p)/4046.856).toFixed(2)+' ac</b></span><span>Perimeter <b>'+fmtLen(per(p))+'</b></span>';
function upd(){handles({pts:draw.pts,poly:draw.poly,grp:draw.mk,info:'#dinfo',redo:upd})}

function endDraw(){resetDrawUI();map.removeLayer(draw.poly);map.removeLayer(draw.mk);draw=null;$('#drawbar').classList.add('hide');$('#main').classList.remove('hide')}

$('#dDone').onclick=()=>{
  if(draw.pts.length<3){alert('Add at least 3 corners.');return}
  if(draw.holeFor){const it=S.items.find(x=>x.id===draw.holeFor);$('#drawbar').classList.add('hide');
    open('<h2>Cutout: '+(area(draw.pts)/4046.856).toFixed(2)+' ac</h2><div class="small">This area is taken out of '+esc(it.name)+', so its acres drop by this much.</div><label>What is it?</label><input type="text" id="hn" list="holel" placeholder="e.g. Oil site, power line"><datalist id="holel"><option>Oil site</option><option>Power line</option><option>Slough</option><option>Rock pile</option><option>Pole</option></datalist><div class="btns"><button onclick="measureOnly()">Discard</button><button class="go" onclick="saveHole()">Save cutout</button></div>');return}
  const l=S.layers.find(x=>x.id===S.active);
  $('#drawbar').classList.add('hide');
  open('<h2>'+fm(draw.pts)+'</h2><label>Name</label><input type="text" id="pn" placeholder="e.g. Home North, wild oat patch 1"><label>Date</label><input type="date" id="pd" value="'+today()+'"><label>Notes</label><textarea id="pnote" rows="3" placeholder="e.g. Chicken manure, rate, weather"></textarea><div class="small" style="margin-top:8px">Saves into layer: <b>'+esc(l?l.name:'(none)')+'</b></div>'+
  '<div class="btns"><button onclick="measureOnly()">Measure only</button><button class="go" onclick="savePoly()">Save</button></div>');
  sheet.dataset.draw='1';
};
function startCutout(id){

function delHole(id,k){if(!confirm('Remove this cutout?'))return;const it=S.items.find(x=>x.id===id);it.holes.splice(k,1);if(!it.holes.length)delete it.holes;save();map.closePopup();redraw();if(fcard===id&&!sheet.classList.contains('hide'))fieldSheet(id)}

let detYr='';
function detailsSheet(id){const it=S.items.find(i=>i.id===id),l=S.layers.find(x=>x.id===it.layer);if(it.type==='obs')return obsDetails(id);map.closePopup();detYr=cropYear();
  const groups=[...new Set(S.items.filter(x=>x.type==='poly'&&x.group).map(x=>x.group))];
  const fld=it.type==='poly'&&l.always;
  const crop=fld?'<label>Crop for '+detYr+'</label><input type="text" id="dc" list="cropl" value="'+esc((it.crops||{})[detYr]||'')+'" placeholder="e.g. Barley"><datalist id="cropl">'+DEFCROPS.map(c=>'<option>'+c+'</option>').join('')+'</datalist><div class="small">Each year has its own crop. Change the year box at the top to set another year.</div>'+'<label>Seeded date for '+detYr+'</label><input type="date" id="dsd" value="'+esc((it.seeded||{})[detYr]||'')+'">'+
    '<label>Group name (fields farmed as one)</label><input type="text" id="dg" list="grpl" value="'+esc(it.group||'')+'" placeholder="e.g. Kersey 640"><datalist id="grpl">'+groups.map(g=>'<option>'+esc(g)+'</option>').join('')+'</datalist><div class="small">Give separate fields the same group name and they are labelled, cropped and tracked as one field. Leave empty if it stands alone.</div>':'';
  open('<h2>Details</h2><label>Name</label><input type="text" id="dn" value="'+esc(it.name)+'">'+crop+'<label>Date</label><input type="date" id="dd" value="'+esc(it.date||'')+'"><label>Notes</label><textarea id="dt" rows="4">'+esc(it.note||'')+'</textarea><div class="btns"><button onclick="closeSheet()">Cancel</button><button class="go" onclick="saveDetails(\''+id+'\')">Save</button></div>')}
function saveDetails(id){const it=S.items.find(i=>i.id===id);it.name=$('#dn').value.trim()||it.name;it.date=$('#dd').value;it.note=$('#dt').value.trim();
  if($('#dg')){const g=$('#dg').value.trim();if(g)it.group=g;else delete it.group}
  if($('#dc')){it.crops=it.crops||{};const prev=it.crops[detYr],c=$('#dc').value.trim(),mem=it.group?S.items.filter(x=>x.type==='poly'&&x.group===it.group):[it];
    if(c)mem.forEach(x=>{x.crops=x.crops||{};x.crops[detYr]=c});
    else if(prev)mem.forEach(x=>{if(x.crops)delete x.crops[detYr]});
    else{const o=mem.find(x=>x!==it&&x.crops&&x.crops[detYr]);if(o)it.crops[detYr]=o.crops[detYr]}}
  if($('#dsd')){const v=$('#dsd').value,m2=it.group?S.items.filter(x=>x.type==='poly'&&x.group===it.group):[it];m2.forEach(x=>{x.seeded=x.seeded||{};if(v)x.seeded[detYr]=v;else delete x.seeded[detYr]})}
  save();closeSheet();redraw()}

/* full backup and restore (fields, layers, points, photos) */
function backupData(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download='fairview-scouting-backup-'+today()+'.json';a.click();
}
function restoreData(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;
    try{const d=JSON.parse(await f.text());if(!d.layers||!d.items)throw 0;
      if(!confirm('Replace everything in the app with this backup ('+d.items.length+' items)?'))return;
      S=d;migrate();await save();closeSheet();redraw();zoomAll();
    }catch(e){alert('That file is not a scouting backup.')}};
  i.click();
}

function ptSheet(pos,acc){

  open('<h2>Sample point</h2><div class="small">'+pos[0].toFixed(5)+', '+pos[1].toFixed(5)+(acc?' (GPS ±'+Math.round(acc)+' m)':' (crosshair)')+'</div>'+

  '<label>Depth</label><select id="td"><option value="">Not recorded</option><option>0–6 in</option><option>6–12 in</option><option>12–24 in</option><option>0–12 in</option><option>0–24 in</option></select>'+

/* tap overlapping areas: list them all */
function ptIn(p,q){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if((p[i][0]>q[0])!==(p[j][0]>q[0])&&q[1]<(p[j][1]-p[i][1])*(q[0]-p[i][0])/(p[j][0]-p[i][0])+p[i][1])c=!c}return c}
let lastHit=null;
function hitsAt(ll){
  const q=[ll.lat,ll.lng],out=[];
  S.layers.forEach(l=>{if(l.visible)S.items.forEach(i=>{if(i.layer===l.id&&i.type==='poly'&&(l.always||YR==='all'||yrOf(i)===+YR)&&ptIn(i.pts,q))out.push([i,l])})});
  return out;
}

  const c=h.length===1?pop(h[0][0],h[0][1]):'<div class="pop"><b>'+h.length+' areas here</b>'+h.map(([i,l])=>'<button class="hit" onclick="showItem(\''+i.id+'\')"><span style="color:'+l.color+'">■</span> '+esc(i.name)+'<br><small>'+esc(l.name)+(i.date?', '+i.date:'')+', '+(area(i.pts)/4046.856).toFixed(1)+' ac</small></button>').join('')+'</div>';

});

  let l=S.layers.find(x=>(x.name||'').trim().toLowerCase()===c.n.toLowerCase());

const centroid=pts=>[pts.reduce((a,p)=>a+p[0],0)/pts.length,pts.reduce((a,p)=>a+p[1],0)/pts.length];

/* scouting: What are you seeing? */
function scoutStart(fid){
  hideHome();

  fcard=id;map.closePopup();
  const yr=cropYear(),mm=members(f),total=mm.reduce((a,x)=>a+netArea(x),0),crop=(f.crops||{})[yr]||'',seeded=(f.seeded||{})[yr];
  const obs=S.items.filter(i=>i.type==='obs'&&mm.some(m=>ptIn(m.pts,i.pos)&&!holesOf(m).some(h=>ptIn(h.pts,i.pos)))).sort((a,b)=>dkey(b).localeCompare(dkey(a))).slice(0,5);
  open('<h2 style="margin:0">'+esc(f.group||f.name)+'</h2>'+
  '<div class="small">'+(crop?esc(crop)+' ('+yr+') · ':'')+acOf(total)+' ac'+(mm.length>1?' · '+mm.length+' parts':'')+(seeded?' · seeded '+dlabel(seeded):'')+'</div>'+
  '<div class="fgrid"><button class="go" onclick="fieldGo(\'scout\',\''+id+'\')">+ SCOUT</button><button class="blue" onclick="fieldGo(\'soil\',\''+id+'\')">SOIL SAMPLE</button><button onclick="historySheet(\''+id+'\')">HISTORY</button><button onclick="detailsSheet(\''+id+'\')">FIELD NOTES</button></div>'+
  (f.note?'<div class="notebox">'+esc(f.note)+'</div>':'')+
  '<div class="pop" style="margin-top:6px">'+polyInfo(f)+'</div>'+
  '<h3>Recent observations</h3>'+
  (obs.length?obs.map(i=>'<div class="orow" onclick="goObs(\''+i.id+'\')"><b>'+esc(obsLine1(i))+'</b><div class="small">'+dlabel(dkey(i))+((i.photos||[]).length?' · Photo':'')+(i.crop?' · '+esc(i.crop):'')+'</div></div>').join(''):'<div class="small">Nothing scouted in this field yet.</div>')+
  '<div class="two" style="margin-top:12px"><button onclick="fieldGo(\'edit\',\''+id+'\')">Edit corners</button><button onclick="fieldGo(\'cut\',\''+id+'\')">Cut out</button><button onclick="fieldGo(\'copy\',\''+id+'\')">Copy</button></div>'+
  '<div class="btns"><button class="no" onclick="fieldDel(\''+id+'\')">Delete field</button><button class="go" onclick="closeSheet()">Close</button></div>');
}
function fieldGo(a,id){
  closeSheet();
  if(a==='scout')scoutStart(id);
  else if(a==='soil')$('#bPt').click();
  else if(a==='edit')editItem(id);
  else if(a==='cut')startCutout(id);
  else if(a==='copy')copyItem(id);
}
function fieldDel(id){if(!confirm('Delete this field? Scouting pins stay on the map.'))return;S.items=S.items.filter(i=>i.id!==id);save();closeSheet();redraw()}

/* fields list (Field Records) */
function fieldRows(){
  const seen=new Set(),rows=[];
  S.items.filter(i=>i.type==='poly'&&layerOf(i).always).forEach(i=>{
    const key=i.group?'g:'+i.group:i.id;if(seen.has(key))return;seen.add(key);
    const mm=members(i);rows.push({i,mm,name:i.group||i.name,ac:mm.reduce((a,x)=>a+netArea(x),0),crop:(i.crops||{})[cropYear()]||''});
  });
  return rows.sort((a,b)=>a.name.localeCompare(b.name));
}
function fieldsSheet(){
  const rows=fieldRows();
  open('<h2>Fields · '+cropYear()+'</h2>'+(rows.length?rows.map(r=>'<div class="orow" onclick="goField(\''+r.i.id+'\')"><b>'+esc(r.name)+'</b> · '+acOf(r.ac)+' ac<div class="small">'+(r.crop?esc(r.crop):'No crop set for '+cropYear())+(r.mm.length>1?' · '+r.mm.length+' parts':'')+'</div></div>').join(''):'<div class="small">No fields yet. Tap Field Map, then Draw / measure, and outline your first field.</div>')+'<div class="btns"><button class="go" onclick="closeSheet()">Done</button></div>');
}
function goField(id){
  const f=S.items.find(x=>x.id===id),pts=[];members(f).forEach(m=>m.pts.forEach(q=>pts.push(q)));
  closeSheet();map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:17});fieldSheet(id);
}

/* home screen */
const stat=(n,t)=>'<div class="stat"><b>'+n+'</b><span>'+t+'</span></div>';
function showHome(){
  const keys=new Set(fieldRows().map(r=>r.i.id)),yr=cropYear(),crops=new Set(fieldRows().map(r=>r.crop).filter(Boolean)),cut=Date.now()-30*864e5,done=new Set();
  S.items.forEach(i=>{if(i.type==='obs'&&new Date(dkey(i)+'T12:00').getTime()>=cut){const f=fieldOf(i.pos);if(f)done.add(f.group?'g:'+f.group:f.id)}});
  $('#hstats').innerHTML=stat(keys.size,'Fields')+stat(crops.size,'Crop types in '+yr)+stat(done.size,'Fields scouted in 30 days');
  $('#home').classList.remove('hide');
}
function hideHome(){$('#home').classList.add('hide')}
const HGO={map:()=>{},scout:()=>scoutStart(),soil:()=>$('#bPt').click(),draw:()=>$('#bDraw').click(),obs:()=>obsListSheet(),fields:()=>fieldsSheet(),layers:()=>layersSheet()};
document.querySelectorAll('#home [data-go]').forEach(b=>b.onclick=()=>{hideHome();HGO[b.dataset.go]()});
$('#fabH').onclick=()=>{if(draw||edit||pin||locMode)return;closeSheet();map.closePopup();showHome()};

/* export as GeoJSON */
function exportData(){
  const fc={type:'FeatureCollection',features:S.items.map(i=>{const l=S.layers.find(x=>x.id===i.layer)||{};
    const g=i.type==='poly'?{type:'Polygon',coordinates:[i.pts].concat((i.holes||[]).map(h=>h.pts)).map(r=>r.concat([r[0]]).map(q=>[q[1],q[0]]))}:{type:'Point',coordinates:[i.pos[1],i.pos[0]]};
    return {type:'Feature',geometry:g,properties:{layer:l.name,color:l.color,name:i.name,date:i.date,depth:i.depth,acres:i.type==='poly'?+(netArea(i)/4046.856).toFixed(2):undefined,group:i.group,crops:i.crops,crop:i.crop,stage:i.stage,note:i.note,time:new Date(i.t).toISOString(),photos:i.photos}}})};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(fc)],{type:'application/geo+json'}));a.download='scouting-'+new Date().toISOString().slice(0,10)+'.geojson';a.click();
}

function zoomAll(){
  const ll=[];S.items.forEach(i=>{(i.type==='poly'?i.pts:[i.pos]).forEach(q=>ll.push(q))});
  if(ll.length)map.fitBounds(L.latLngBounds(ll),{padding:[40,40],maxZoom:17});
}
load().then(d=>{if(d)S=d;migrate();redraw();zoomAll();showHome()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
